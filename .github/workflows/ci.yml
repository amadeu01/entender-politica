name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      # Reproducibility: rebuilding from committed raw snapshots must not change
      # the committed processed data or changelog.
      - run: uv run compilador build
      - name: Check committed data is unchanged (including new files)
        run: test -z "$(git status --porcelain -- data/)" || (git status --porcelain -- data/; exit 1)
