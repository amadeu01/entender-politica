slug: desigualdade-de-renda
title:
  pt: "Desigualdade de renda no Brasil desde 1980"
  en: "Income inequality in Brazil since 1980"
question:
  pt: "Como a desigualdade de renda evoluiu no Brasil desde 1980, e o que a literatura revisada por pares atribui às mudanças?"
  en: "How has income inequality in Brazil evolved since 1980, and what does peer-reviewed research attribute the changes to?"
hypothesis:
  pt: >-
    A queda da desigualdade a partir de 2001 coincidiu com políticas de salário mínimo e de
    transferência de renda, mas também com uma queda parecida em outros países da região e
    com mudanças no mercado de trabalho; nenhum fator isolado explica toda a queda.
  en: >-
    The fall in inequality from 2001 coincided with minimum wage and cash transfer policies,
    but also with a similar fall in other countries of the region and with labor market
    changes; no single factor explains the whole fall.
indicators:
  - ipeadata.disoc_rdcg
  - ibge_sidra.gini_pnadc
  - wdi.si_pov_gini
  - ipeadata.disoc_ppy
  - wdi.si_pov_dday
  - undp_hdr.hdi
  - undp_hdr.ihdi
  - wdi.ny_gdp_pcap_kd
  - wdi.fp_cpi_totl_zg
geographies: [BRA, ARG, CHL, COL, MEX]
period: { start: 1976, end: 2025 }
method: descriptive
method_description:
  pt: >-
    Descrição das séries de desigualdade e pobreza, mantidas separadas por pesquisa (PNAD
    antiga e PNAD Contínua), comparadas com países vizinhos, e revisão de estudos que
    decompõem a queda da desigualdade. Não há estimativa causal própria: as frações da
    queda atribuídas a cada fator vêm dos estudos citados e dependem dos métodos deles.
  en: >-
    Description of inequality and poverty series, kept separate by survey (old PNAD and
    Continuous PNAD), compared with neighboring countries, and a review of studies that
    decompose the fall in inequality. There is no original causal estimate: shares of the
    fall attributed to each factor come from the cited studies and depend on their methods.
causal_claims: false
evidence_for:
  - text:
      pt: >-
        O aumento real do salário mínimo de {{ cite("128%", "10.1257/aer.20181506", "resumo") }}
        entre 1996 e 2018 explica {{ cite("45%", "10.1257/aer.20181506", "resumo") }} da
        queda da desigualdade dos rendimentos do trabalho, com efeitos pequenos sobre
        emprego e produto, segundo um modelo de equilíbrio do mercado de trabalho.
      en: >-
        The {{ cite("128%", "10.1257/aer.20181506", "abstract") }} real increase in the
        minimum wage between 1996 and 2018 accounts for
        {{ cite("45%", "10.1257/aer.20181506", "abstract") }} of the fall in labor earnings
        inequality, with muted effects on employment and output, according to an
        equilibrium model of the labor market.
    references: [10.1257/aer.20181506]
  - text:
      pt: >-
        Transferências condicionadas de renda representavam
        {{ cite("menos de 1%", "10.24201/ee.v0i0.387", "resumo") }} da renda total, mas, por
        serem bem focalizadas, responderam por cerca de
        {{ cite("21%", "10.24201/ee.v0i0.387", "resumo") }} da queda do Gini no Brasil e no
        México entre meados dos anos 1990 e meados dos anos 2000 (decomposição contábil).
      en: >-
        Conditional cash transfers were
        {{ cite("less than 1%", "10.24201/ee.v0i0.387", "abstract") }} of total income but,
        being well targeted, accounted for about
        {{ cite("21%", "10.24201/ee.v0i0.387", "abstract") }} of the fall in the Gini in
        Brazil and Mexico between the mid-1990s and the mid-2000s (accounting decomposition).
    references: [10.24201/ee.v0i0.387]
  - text:
      pt: >-
        O Bolsa Família ajudou a reduzir a desigualdade e a extrema pobreza e melhorou
        resultados educacionais, sem impacto negativo sobre a participação no mercado de
        trabalho; em saúde e nutrição o efeito esperado não apareceu, por limitações da
        oferta de serviços.
      en: >-
        Bolsa Família helped reduce inequality and extreme poverty and improved education
        outcomes, with no negative impact on labor force participation; in health and
        nutrition the intended effect did not appear, due to supply-side constraints.
    references: [10.1017/S0023879100009390]
evidence_against:
  - text:
      pt: >-
        A queda dos rendimentos do trabalho entre 1995 e 2012 se deve sobretudo à redução
        do retorno à experiência no mercado de trabalho, responsável por
        {{ cite("53%", "10.1093/wber/lhab005", "resumo") }} da queda do Gini dos
        rendimentos do trabalho, mais do que à queda do prêmio da educação. Isso aponta
        para mudanças no mercado de trabalho, e não só para políticas específicas.
      en: >-
        The fall in labor earnings inequality between 1995 and 2012 is mostly due to lower
        returns to labor market experience, accounting for
        {{ cite("53%", "10.1093/wber/lhab005", "abstract") }} of the fall in the labor
        earnings Gini, more than the falling education premium. This points to labor
        market changes, not only to specific policies.
    references: [10.1093/wber/lhab005]
  - text:
      pt: >-
        Com dados do Imposto de Renda, a concentração de renda no topo é substancialmente
        maior do que nas pesquisas domiciliares e permaneceu, em termos gerais, estável
        entre 2006 e 2012. A queda medida pelas pesquisas pode exagerar a redução da
        desigualdade total.
      en: >-
        With income tax data, top-income concentration is substantially higher than in
        household surveys and remained broadly stable between 2006 and 2012. The fall
        measured by surveys may overstate the reduction in overall inequality.
    references: [10.1590/00115258201537]
  - text:
      pt: >-
        Há evidências sugestivas de que algumas famílias reduziram a oferta de trabalho para
        se tornarem elegíveis ao Bolsa Família, sobretudo mulheres chefes de família,
        segundo dados da PNAD de 2006. O resultado contrasta com estudos que não encontram
        efeito negativo sobre a participação no mercado de trabalho.
      en: >-
        There is suggestive evidence that some families reduced labor supply to become
        eligible for Bolsa Família, especially female heads of household, according to
        2006 PNAD data. This contrasts with studies that find no negative effect on labor
        force participation.
    references: [10.1016/j.econ.2014.09.001]
  - text:
      pt: >-
        Considerando o sistema fiscal como um todo, por volta de 2010, quando aposentadorias
        não são tratadas como transferência, a política fiscal aumentava a pobreza no Brasil
        por causa dos impostos sobre o consumo de bens básicos, embora sempre reduzisse a
        desigualdade.
      en: >-
        Considering the whole fiscal system around 2010, when pensions are not treated as
        transfers, fiscal policy increased poverty in Brazil because of consumption taxes
        on basic goods, although it always reduced inequality.
    references: [10.1515/jgd-2016-0015]
limitations:
  - pt: >-
      As séries da PNAD antiga e da PNAD Contínua não são comparáveis em nível e não foram
      emendadas. A comparação entre períodos deve ser feita dentro de cada série.
    en: >-
      The old PNAD and Continuous PNAD series are not level-comparable and were not
      spliced. Comparisons across periods should be made within each series.
  - pt: >-
      Pesquisas domiciliares subestimam as rendas do topo; o nível e talvez a tendência da
      desigualdade total são diferentes com dados tributários.
    en: >-
      Household surveys underestimate top incomes; the level and possibly the trend of
      overall inequality differ with tax data.
  - pt: >-
      Comparações regionais usam o Gini do Banco Mundial, que para a Argentina cobre só a
      população urbana, e cujas pesquisas mudam de ano para ano em vários países.
    en: >-
      Regional comparisons use the World Bank Gini, which for Argentina covers only the
      urban population, and whose underlying surveys change over time in several countries.
  - pt: >-
      As frações da queda atribuídas a salário mínimo, transferências e mercado de trabalho
      vêm de estudos com períodos, medidas de renda e métodos diferentes; não se somam.
    en: >-
      Shares of the fall attributed to the minimum wage, transfers and the labor market
      come from studies with different periods, income measures and methods; they do not
      add up.
  - pt: >-
      A coincidência temporal entre uma política e a queda da desigualdade não demonstra
      que a política causou a queda (ver a metodologia do site).
    en: >-
      Temporal coincidence between a policy and the fall in inequality does not show that
      the policy caused the fall (see the site methodology).
