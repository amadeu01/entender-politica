# Períodos de exercício da Presidência da República (1979–hoje).
# Federal presidency periods (1979–present).
#
# Cada período é um trecho contínuo em que uma pessoa exerceu a Presidência.
# `end` é exclusivo e igual ao `start` do período seguinte. Interinidades
# (afastamento do titular durante processo de impeachment, posse adiada) são
# períodos próprios. Substituições breves por doença ou viagem (por exemplo, Aureliano
# Chaves durante a doença de João Figueiredo em 1981 e 1983) não são registradas.
# Ver docs/adr/0003-governos-e-causalidade.md.
#
# Each period is a continuous stretch in which one person exercised the presidency. `end`
# is exclusive. Acting presidencies tied to impeachment or a delayed inauguration are their
# own periods; brief substitutions for illness or travel are not recorded.
verified_on: 2026-10-25
sources:
  - https://www.biblioteca.presidencia.gov.br/presidencia/ex-presidentes
  - https://www.gov.br/planalto/pt-br/conheca-a-presidencia/acervo/galeria-de-presidentes

periods:
  - id: figueiredo
    president: João Figueiredo
    condition: titular
    term: { pt: "1979–1985", en: "1979–1985" }
    start: 1979-03-15
    end: 1985-03-15

  - id: sarney-interino
    president: José Sarney
    condition: interino
    term: { pt: "1985 (exercício por doença de Tancredo Neves)", en: "1985 (acting, Tancredo Neves ill)" }
    start: 1985-03-15
    end: 1985-04-21
    note:
      pt: "Tancredo Neves, eleito pelo Colégio Eleitoral, adoeceu antes da posse e morreu em 21/04/1985."
      en: "Tancredo Neves, elected by the Electoral College, fell ill before taking office and died on 1985-04-21."

  - id: sarney
    president: José Sarney
    condition: titular
    term: { pt: "1985–1990", en: "1985–1990" }
    start: 1985-04-21
    end: 1990-03-15

  - id: collor
    president: Fernando Collor
    condition: titular
    term: { pt: "1990–1992", en: "1990–1992" }
    start: 1990-03-15
    end: 1992-10-02
    note:
      pt: "Afastado em 02/10/1992 pela abertura do processo de impeachment; renunciou em 29/12/1992."
      en: "Suspended on 1992-10-02 when impeachment proceedings opened; resigned on 1992-12-29."

  - id: itamar-interino
    president: Itamar Franco
    condition: interino
    term: { pt: "1992 (exercício durante o impeachment)", en: "1992 (acting during impeachment)" }
    start: 1992-10-02
    end: 1992-12-29

  - id: itamar
    president: Itamar Franco
    condition: titular
    term: { pt: "1992–1994", en: "1992–1994" }
    start: 1992-12-29
    end: 1995-01-01

  - id: fhc-1
    president: Fernando Henrique Cardoso
    condition: titular
    term: { pt: "1º mandato (1995–1998)", en: "1st term (1995–1998)" }
    start: 1995-01-01
    end: 1999-01-01

  - id: fhc-2
    president: Fernando Henrique Cardoso
    condition: titular
    term: { pt: "2º mandato (1999–2002)", en: "2nd term (1999–2002)" }
    start: 1999-01-01
    end: 2003-01-01

  - id: lula-1
    president: Luiz Inácio Lula da Silva
    condition: titular
    term: { pt: "1º mandato (2003–2006)", en: "1st term (2003–2006)" }
    start: 2003-01-01
    end: 2007-01-01

  - id: lula-2
    president: Luiz Inácio Lula da Silva
    condition: titular
    term: { pt: "2º mandato (2007–2010)", en: "2nd term (2007–2010)" }
    start: 2007-01-01
    end: 2011-01-01

  - id: dilma-1
    president: Dilma Rousseff
    condition: titular
    term: { pt: "1º mandato (2011–2014)", en: "1st term (2011–2014)" }
    start: 2011-01-01
    end: 2015-01-01

  - id: dilma-2
    president: Dilma Rousseff
    condition: titular
    term: { pt: "2º mandato (2015–2016)", en: "2nd term (2015–2016)" }
    start: 2015-01-01
    end: 2016-05-12
    note:
      pt: "Afastada em 12/05/2016 pela abertura do processo de impeachment no Senado; destituída em 31/08/2016."
      en: "Suspended on 2016-05-12 when the Senate opened impeachment proceedings; removed on 2016-08-31."

  - id: temer-interino
    president: Michel Temer
    condition: interino
    term: { pt: "2016 (exercício durante o impeachment)", en: "2016 (acting during impeachment)" }
    start: 2016-05-12
    end: 2016-08-31

  - id: temer
    president: Michel Temer
    condition: titular
    term: { pt: "2016–2018", en: "2016–2018" }
    start: 2016-08-31
    end: 2019-01-01

  - id: bolsonaro
    president: Jair Bolsonaro
    condition: titular
    term: { pt: "2019–2022", en: "2019–2022" }
    start: 2019-01-01
    end: 2023-01-01

  - id: lula-3
    president: Luiz Inácio Lula da Silva
    condition: titular
    term: { pt: "3º mandato (2023–)", en: "3rd term (2023–)" }
    start: 2023-01-01
    end: null
