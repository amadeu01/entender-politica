period: dilma-1
summary:
  pt: Entre 2010 e 2014 o gasto público em educação foi de {{ v("wdi.se_xpd_totl_gd_zs", "BRA", 2010)
    }}% a {{ v("wdi.se_xpd_totl_gd_zs", "BRA", 2014) }}% do PIB, e a taxa bruta de matrícula na educação
    superior de {{ v("wdi.se_ter_enrr", "BRA", 2012) }}% em 2012 a {{ v("wdi.se_ter_enrr", "BRA", 2014)
    }}% em 2014. O governo criou o Pronatec, a lei de cotas nas federais, a obrigatoriedade dos quatro
    aos dezessete anos em lei, a destinação de royalties do petróleo à educação e o plano nacional 2014–2024.
  en: Between 2010 and 2014 public education spending went from {{ v("wdi.se_xpd_totl_gd_zs", "BRA", 2010)
    }}% to {{ v("wdi.se_xpd_totl_gd_zs", "BRA", 2014) }}% of GDP, and the gross tertiary enrollment ratio
    from {{ v("wdi.se_ter_enrr", "BRA", 2012) }}% in 2012 to {{ v("wdi.se_ter_enrr", "BRA", 2014) }}%
    in 2014. The government created Pronatec, the quota law for federal institutions, the legal compulsory
    schooling from four to seventeen, the allocation of oil royalties to education and the 2014–2024 national
    plan.
context:
  pt: O ciclo de commodities e o crescimento do emprego e da renda até 2013 favoreceram a demanda por
    educação superior e técnica. Não há registro, nesta página, de corte em educação no período; as séries
    de matrícula do Banco Mundial só começam em 2012.
  en: The commodity cycle and employment and income growth until 2013 favored demand for higher and technical
    education. This page records no education cut in the period; the World Bank enrollment series only
    start in 2012.
started:
- title:
    pt: Programa Nacional de Acesso ao Ensino Técnico e Emprego (Pronatec)
    en: National Program for Access to Technical Education and Employment (Pronatec)
  year: 2011
  date: '2011-10-26'
  instrument: Lei 12.513/2011
  norm: lei-12513-2011
  submodules:
  - educacao-profissional
  description:
    pt: Oferece cursos técnicos e de qualificação com bolsa-formação, ampliando a rede federal e parcerias
      com o Sistema S.
    en: Offers technical and qualification courses with a training grant, expanding the federal network
      and partnerships with the S System.
  source: https://legis.senado.leg.br/norma/584369
  checked: '2026-11-01'
- title:
    pt: Ciência sem Fronteiras
    en: Science without Borders
  year: 2011
  date: '2011-12-13'
  instrument: Decreto 7.642/2011
  submodules:
  - pos-graduacao-ciencia
  - graduacao
  description:
    pt: Concede bolsas para estudo no exterior, sobretudo em graduação-sanduíche em áreas de ciência,
      tecnologia, engenharia e matemática.
    en: Grants scholarships for study abroad, mostly sandwich undergraduate programs in science, technology,
      engineering and mathematics.
  source: https://legis.senado.leg.br/norma/588454
  checked: '2026-11-01'
  later:
  - year: 2016
    status: reduced
    note:
      pt: As bolsas de graduação no exterior deixaram de ser concedidas em 2016; as de pós-graduação continuaram.
      en: Undergraduate grants abroad stopped being awarded in 2016; graduate ones continued.
- title:
    pt: Lei de Cotas nas instituições federais
    en: Quota Law in federal institutions
  year: 2012
  date: '2012-08-29'
  instrument: Lei 12.711/2012
  norm: lei-12711-2012
  submodules:
  - graduacao
  - ensino-medio
  - educacao-profissional
  description:
    pt: Reserva metade das vagas das universidades e institutos federais a egressos de escolas públicas,
      com subcotas por renda e por raça e etnia.
    en: Reserves half of the places in federal universities and institutes for public-school graduates,
      with sub-quotas by income and by race and ethnicity.
  source: https://legis.senado.leg.br/norma/588087
  checked: '2026-11-01'
  later:
  - year: 2023
    status: amended
    by: Lei 14.723/2023
    note:
      pt: Revista em 2023, com mudança no teto de renda familiar.
      en: Revised in 2023, changing the family income ceiling.
- title:
    pt: Pacto Nacional pela Alfabetização na Idade Certa
    en: National Pact for Literacy at the Right Age
  year: 2012
  date: '2012-07-04'
  instrument: Portaria MEC 867/2012
  submodules:
  - ensino-fundamental
  - planejamento
  description:
    pt: Compromisso das três esferas de governo de alfabetizar todas as crianças até o fim do ciclo inicial,
      com formação de professores; foi sucedido pelo Programa Mais Alfabetização.
    en: Commitment of the three levels of government to make all children literate by the end of the initial
      cycle, with teacher training; it was succeeded by the More Literacy Program.
  source: https://www.gov.br/mec/pt-br
  later:
  - year: 2018
    status: replaced
    note:
      pt: Sucedido em 2018 pelo Programa Mais Alfabetização; não foi localizado ato que encerre o pacto.
      en: Succeeded in 2018 by the More Literacy Program; no act ending the pact was located.
- title:
    pt: Educação básica obrigatória dos quatro aos dezessete anos
    en: Compulsory basic education from four to seventeen
  year: 2013
  date: '2013-04-04'
  instrument: Lei 12.796/2013
  norm: lei-12796-2013
  submodules:
  - educacao-infantil
  - ensino-fundamental
  - ensino-medio
  description:
    pt: Altera a LDB para aplicar a obrigatoriedade criada pela emenda de 2009.
    en: Amends the LDB to apply the compulsory schooling created by the 2009 amendment.
  source: https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2013/lei/l12796.htm
- title:
    pt: Royalties do petróleo para educação e saúde
    en: Oil royalties for education and health
  year: 2013
  date: '2013-09-09'
  instrument: Lei 12.858/2013
  submodules:
  - financiamento
  description:
    pt: Destina parte dos royalties e da participação especial do petróleo à educação e à saúde.
    en: Allocates part of oil royalties and special participation to education and health.
  source: https://legis.senado.leg.br/norma/591306
  checked: '2026-11-01'
- title:
    pt: Plano Nacional de Educação 2014–2024
    en: National Education Plan 2014–2024
  year: 2014
  date: '2014-06-25'
  instrument: Lei 13.005/2014
  norm: lei-13005-2014
  submodules:
  - planejamento
  - financiamento
  description:
    pt: Plano decenal com metas por etapa e a meta de ampliar o investimento público em educação como
      proporção do PIB.
    en: Ten-year plan with goals by level and the goal of raising public investment in education as a
      share of GDP.
  source: https://www.planalto.gov.br/ccivil_03/_ato2011-2014/2014/lei/l13005.htm
  later:
  - year: 2026
    status: replaced
    by: Lei 15.388/2026
    note:
      pt: Sucedido em 2026 por novo plano decenal.
      en: Succeeded in 2026 by a new ten-year plan.
