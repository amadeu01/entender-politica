cuts:
- kind: withheld
  title:
    pt: Contingenciamento do orçamento do MEC
    en: Withholding of the MEC budget
  year: 2015
  date: '2015-05-22'
  submodules:
  - graduacao
  - educacao-profissional
  - financiamento
  description:
    pt: O decreto de programação orçamentária de maio de 2015 limitou despesas discricionárias dentro
      do ajuste fiscal, e a imprensa registrou bloqueio de bilhões de reais no MEC, revisto ao longo do
      ano. Valores do bloqueio diferem entre fontes e não foram conferidos com o decreto. Na execução,
      o gasto federal em educação, a preços constantes e em bilhões de reais, foi pago em {{ v('siconfi.educ_uniao_paga',
      'BRA', 2014) }} em 2014 e {{ v('siconfi.educ_uniao_paga', 'BRA', 2015) }} em 2015, e empenhado em
      {{ v('siconfi.educ_uniao_empenhada', 'BRA', 2014) }} e {{ v('siconfi.educ_uniao_empenhada', 'BRA',
      2015) }}.
    en: The May 2015 budget programming decree limited discretionary spending within the fiscal adjustment,
      and the press reported a freeze of billions of reais at MEC, revised over the year. Block amounts
      differ across sources and were not checked against the decree. In execution, federal education spending,
      at constant prices and in billions of reais, was paid at {{ v('siconfi.educ_uniao_paga', 'BRA',
      2014) }} in 2014 and {{ v('siconfi.educ_uniao_paga', 'BRA', 2015) }} in 2015, and committed at {{
      v('siconfi.educ_uniao_empenhada', 'BRA', 2014) }} and {{ v('siconfi.educ_uniao_empenhada', 'BRA',
      2015) }}.
  source: https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2015/decreto/d8456.htm
  instrument: Decreto 8.456/2015
- kind: cut
  title:
    pt: Endurecimento das regras do Fies
    en: Tightening of Fies rules
  year: 2015
  submodules:
  - graduacao
  - financiamento
  description:
    pt: O aumento dos juros e a exigência de nota mínima no Enem, com redação não zerada, para novos contratos
      reduziram a entrada de contratos do Fies; a recessão também reduziu a procura (números divergem
      entre fontes e não foram conferidos).
    en: Higher interest and a minimum Enem score, with a non-zero essay, for new contracts reduced new
      Fies contracts; the recession also reduced demand (figures differ across sources and were not checked).
  source: https://agenciabrasil.ebc.com.br/educacao/noticia/2015-07/novas-regras-do-fies-para-segundo-semestre-entram-em-vigor
