period: dilma-2
summary:
  pt: Em 2015 o gasto público em educação foi de {{ v("wdi.se_xpd_totl_gd_zs", "BRA", 2015) }}% do PIB,
    e a taxa bruta de matrícula na educação superior foi de {{ v("wdi.se_ter_enrr", "BRA", 2014) }}% em
    2014 a {{ v("wdi.se_ter_enrr", "BRA", 2016) }}% em 2016. O período teve recessão, bloqueio de despesas
    do MEC no início de 2015 e endurecimento das regras do Fies.
  en: In 2015 public education spending was {{ v("wdi.se_xpd_totl_gd_zs", "BRA", 2015) }}% of GDP, and
    the gross tertiary enrollment ratio went from {{ v("wdi.se_ter_enrr", "BRA", 2014) }}% in 2014 to
    {{ v("wdi.se_ter_enrr", "BRA", 2016) }}% in 2016. The period had a recession, a freeze on MEC spending
    in early 2015 and tighter Fies rules.
context:
  pt: A recessão de 2014–2016 reduziu emprego e renda e, por si só, a procura por cursos superiores privados;
    a queda de novos contratos do Fies tem, portanto, pelo menos duas explicações que os dados anuais
    não separam. O gasto total em educação, que inclui estados e municípios, continuou subindo como proporção
    do PIB em parte porque o PIB caiu.
  en: The 2014–2016 recession reduced employment and income and, by itself, demand for private higher
    education courses; the fall in new Fies contracts therefore has at least two explanations that annual
    data cannot separate. Total education spending, which includes states and municipalities, kept rising
    as a share of GDP partly because GDP fell.
