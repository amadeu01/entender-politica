# Educação neste governo: o que começou, o que foi cortado e as séries do período (ADR 0013).
# Itens sem `checked` ainda não foram conferidos com o registro oficial.
period: figueiredo
summary:
  pt: 'Série de alfabetização de adultos do Banco Mundial só começa em {{ v("wdi.se_adt_litr_zs", "BRA",
    1980) }}% em 1980 (população de quinze anos ou mais), e as demais séries de educação do catálogo começam
    depois deste governo. Por isso esta página registra, sobretudo, o que mudou nas regras: a volta da
    vinculação constitucional de receitas à educação e o fim da profissionalização obrigatória no segundo
    grau.'
  en: 'The World Bank adult literacy series only begins at {{ v("wdi.se_adt_litr_zs", "BRA", 1980) }}%
    in 1980 (population aged fifteen and over), and the catalog''s other education series start after
    this government. This page therefore records mostly what changed in the rules: the return of the constitutional
    earmark of revenue for education and the end of compulsory vocational training in secondary school.'
context:
  pt: A década de 1980 foi marcada pela crise da dívida externa e pela recessão do início da década, que
    reduziram a receita pública, e pela inércia da expansão de matrículas herdada dos anos 1960 e 1970.
    A literatura aponta que a vinculação só se refletiu em orçamentos a partir de 1986, já no governo
    seguinte.
  en: The 1980s were marked by the external debt crisis and the early-decade recession, which cut public
    revenue, and by the momentum of enrollment expansion inherited from the 1960s and 1970s. The literature
    points out that the earmark only showed in budgets from 1986, in the next government.
started:
- title:
    pt: 'Emenda Calmon: vinculação de receitas à educação'
    en: 'Calmon Amendment: earmarking revenue for education'
  year: 1983
  date: '1983-12-01'
  instrument: Emenda Constitucional 24/1983
  submodules:
  - financiamento
  description:
    pt: Restabelece na Constituição um percentual mínimo da receita de impostos da União, dos estados
      e dos municípios para a manutenção e o desenvolvimento do ensino. Na prática, só passou a pesar
      nos orçamentos em 1986.
    en: Restores in the Constitution a minimum share of Union, state and municipal tax revenue for maintaining
      and developing education. In practice it only weighed on budgets from 1986.
  source: https://www2.camara.leg.br/legin/fed/emecon/1980-1987/emendaconstitucional-24-1-dezembro-1983-364949-publicacaooriginal-1-pl.html
  checked: '2026-11-01'
- title:
    pt: Fim da profissionalização obrigatória no segundo grau
    en: End of compulsory vocational training in secondary school
  year: 1982
  date: '1982-10-18'
  instrument: Lei 7.044/1982
  submodules:
  - ensino-medio
  - educacao-profissional
  description:
    pt: Altera a lei de 1971 e torna facultativa a habilitação profissional no ensino de segundo grau,
      encerrando a obrigatoriedade da formação técnica.
    en: Amends the 1971 law and makes vocational qualification optional in secondary education, ending
      the compulsory technical track.
  source: https://www2.camara.leg.br/legin/fed/lei/1980-1987/lei-7044-18-outubro-1982-357120-norma-pl.html
  checked: '2026-11-01'
indicators:
- wdi.se_adt_litr_zs
- undp_hdr.mys
limitations:
- pt: Os itens desta página foram redigidos a partir de pesquisa em fontes secundárias, sem acesso aos
    textos oficiais no ambiente de desenvolvimento; cada item mostra se foi conferido com o registro oficial.
  en: The items on this page were written from research in secondary sources, without access to the official
    texts in the development environment; each item shows whether it was checked against the official
    record.
- pt: Anos médios de estudo e alfabetização de adultos mudam devagar por construção e refletem décadas
    de matrículas; uma variação num mandato não mede o efeito das políticas daquele mandato. Séries de
    matrícula por etapa só existem a partir de 2007 ou 2012, e não há série de aprendizado nem de gasto
    federal em reais no catálogo.
  en: Mean years of schooling and adult literacy move slowly by construction and reflect decades of enrollment;
    a change within one term does not measure that term's policies. Enrollment series by level only start
    in 2007 or 2012, and the catalog has no learning series or federal spending in reais.
