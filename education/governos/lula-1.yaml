period: lula-1
summary:
  pt: Os anos médios de estudo dos adultos foram de {{ v("undp_hdr.mys", "BRA", 2002) }} em 2002 a {{
    v("undp_hdr.mys", "BRA", 2006) }} em 2006, e o gasto público em educação de {{ v("wdi.se_xpd_totl_gd_zs",
    "BRA", 2002) }}% a {{ v("wdi.se_xpd_totl_gd_zs", "BRA", 2006) }}% do PIB. O governo unificou transferências
    condicionadas no Bolsa Família, criou o ProUni, o sistema de avaliação da educação superior e propôs
    o Fundeb, aprovado ao fim do mandato.
  en: Adults' mean years of schooling went from {{ v("undp_hdr.mys", "BRA", 2002) }} in 2002 to {{ v("undp_hdr.mys",
    "BRA", 2006) }} in 2006, and public education spending from {{ v("wdi.se_xpd_totl_gd_zs", "BRA", 2002)
    }}% to {{ v("wdi.se_xpd_totl_gd_zs", "BRA", 2006) }}% of GDP. The government unified conditional transfers
    into Bolsa Família, created ProUni and the higher education assessment system, and proposed the Fundeb,
    approved at the end of the term.
context:
  pt: O crescimento econômico mais forte e a queda da pobreza no período afetam matrículas e permanência
    independentemente de políticas educacionais específicas. Avaliações do Bolsa Família sobre frequência
    escolar existem, mas com resultados mistos sobre aprendizado.
  en: Stronger economic growth and falling poverty in the period affect enrollment and retention independently
    of specific education policies. Evaluations of Bolsa Família on school attendance exist, but with
    mixed results on learning.
started:
- title:
    pt: Programa Brasil Alfabetizado
    en: Literate Brazil Program
  year: 2003
  date: '2003-09-08'
  instrument: Decreto 4.834/2003
  submodules:
  - ensino-fundamental
  description:
    pt: Programa federal de alfabetização de jovens e adultos por convênios com parceiros.
    en: Federal youth and adult literacy program run through agreements with partners.
  source: https://www.planalto.gov.br/ccivil_03/decreto/2003/d4834.htm
- title:
    pt: Bolsa Família
    en: Bolsa Família
  year: 2004
  date: '2004-01-09'
  instrument: Lei 10.836/2004
  submodules:
  - ensino-fundamental
  - ensino-medio
  description:
    pt: Unifica programas de transferência de renda, entre eles a bolsa escola, com condicionalidades
      de frequência escolar.
    en: Unifies cash transfer programs, among them the school grant, with school attendance conditions.
  source: https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2004/lei/l10.836.htm
- title:
    pt: Sistema Nacional de Avaliação da Educação Superior (Sinaes)
    en: National Higher Education Assessment System (Sinaes)
  year: 2004
  date: '2004-04-14'
  instrument: Lei 10.861/2004
  submodules:
  - graduacao
  description:
    pt: Substitui o Provão por avaliação de instituições, cursos e estudantes (Enade).
    en: Replaces the Provão with assessment of institutions, courses and students (Enade).
  source: https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2004/lei/l10.861.htm
- title:
    pt: Volta da educação profissional integrada ao ensino médio
    en: Return of vocational education integrated with secondary school
  year: 2004
  date: '2004-07-23'
  instrument: Decreto 5.154/2004
  submodules:
  - ensino-medio
  - educacao-profissional
  description:
    pt: Revoga o decreto de 1997 e permite novamente cursos técnicos integrados ao ensino médio.
    en: Revokes the 1997 decree and again allows technical courses integrated with secondary school.
  source: https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2004/decreto/d5154.htm
- title:
    pt: Programa Universidade para Todos (ProUni)
    en: University for All Program (ProUni)
  year: 2005
  date: '2005-01-13'
  instrument: Lei 11.096/2005
  norm: lei-11096-2005
  submodules:
  - graduacao
  description:
    pt: Isenta tributos de instituições privadas em troca de bolsas integrais e parciais para estudantes
      de baixa renda, com cotas para negros, indígenas e pessoas com deficiência.
    en: Exempts private institutions from taxes in exchange for full and partial scholarships to low-income
      students, with quotas for Black, Indigenous and disabled students.
  source: https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2005/lei/l11096.htm
- title:
    pt: Ensino fundamental de nove anos
    en: Nine-year primary education
  year: 2006
  date: '2006-02-06'
  instrument: Lei 11.274/2006
  norm: lei-11274-2006
  submodules:
  - ensino-fundamental
  - educacao-infantil
  description:
    pt: Amplia o ensino fundamental para nove anos, com ingresso aos seis anos de idade.
    en: Extends primary education to nine years, with entry at age six.
  source: https://www.planalto.gov.br/ccivil_03/_ato2004-2006/2006/lei/l11274.htm
- title:
    pt: Fundeb
    en: Fundeb
  year: 2006
  date: '2006-12-19'
  instrument: Emenda Constitucional 53/2006
  norm: ec-53-2006
  submodules:
  - financiamento
  - educacao-infantil
  - ensino-fundamental
  - ensino-medio
  description:
    pt: Substitui o Fundef por fundo que cobre toda a educação básica, com complementação da União; regulamentado
      em 2007.
    en: Replaces Fundef with a fund covering all of basic education, with a Union top-up; regulated in
      2007.
  source: https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc53.htm
  later:
  - year: 2020
    status: expanded
    by: Emenda Constitucional 108/2020
    note:
      pt: Tornado permanente em 2020, com complementação da União crescente.
      en: Made permanent in 2020, with a growing Union top-up.
cuts:
- kind: earmark
  title:
    pt: Prorrogação da DRU
    en: Extension of the DRU
  year: 2003
  submodules:
  - financiamento
  description:
    pt: A emenda de 2003 prorrogou a desvinculação de receitas da União, que seguiu alcançando a base
      de cálculo do piso federal de educação até a redução para a educação a partir de 2009.
    en: The 2003 amendment extended the Union revenue delinking, which kept reaching the base of the federal
      education minimum until the reduction for education from 2009.
  source: https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc42.htm
  instrument: Emenda Constitucional 42/2003
indicators:
- wdi.se_xpd_totl_gd_zs
