period: lula-2
summary:
  pt: Os anos médios de estudo dos adultos foram de {{ v("undp_hdr.mys", "BRA", 2006) }} em 2006 a {{
    v("undp_hdr.mys", "BRA", 2010) }} em 2010, e o gasto público em educação de {{ v("wdi.se_xpd_totl_gd_zs",
    "BRA", 2006) }}% a {{ v("wdi.se_xpd_totl_gd_zs", "BRA", 2010) }}% do PIB. O governo começou o Fundeb,
    o plano de metas e o índice de qualidade (Ideb), a expansão das universidades federais (Reuni) e dos
    institutos federais, o piso do magistério e a obrigatoriedade escolar dos quatro aos dezessete anos.
  en: Adults' mean years of schooling went from {{ v("undp_hdr.mys", "BRA", 2006) }} in 2006 to {{ v("undp_hdr.mys",
    "BRA", 2010) }} in 2010, and public education spending from {{ v("wdi.se_xpd_totl_gd_zs", "BRA", 2006)
    }}% to {{ v("wdi.se_xpd_totl_gd_zs", "BRA", 2010) }}% of GDP. The government started Fundeb, the targets
    plan and the quality index (Ideb), the expansion of federal universities (Reuni) and federal institutes,
    the teacher pay floor and compulsory schooling from four to seventeen years.
context:
  pt: O crescimento econômico até 2008 e a crise internacional de 2008–2009 afetaram a receita pública.
    A comparação com a América Latina na tabela ajuda a ver o que foi comum à região. Avaliações causais
    de Reuni, ProUni e Fies são escassas na literatura revisada para esta página.
  en: Economic growth until 2008 and the 2008–2009 international crisis affected public revenue. The comparison
    with Latin America in the table helps show what was common to the region. Causal evaluations of Reuni,
    ProUni and Fies are scarce in the literature reviewed for this page.
started:
- title:
    pt: Fundeb em operação
    en: Fundeb in operation
  year: 2007
  date: '2007-06-20'
  instrument: Lei 11.494/2007
  norm: lei-11494-2007
  submodules:
  - financiamento
  - educacao-infantil
  - ensino-fundamental
  - ensino-medio
  description:
    pt: Regulamenta o Fundeb, com regras de distribuição entre estados e municípios e complementação da
      União.
    en: Regulates Fundeb, with distribution rules among states and municipalities and a Union top-up.
  source: https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2007/lei/l11494.htm
  later:
  - year: 2020
    status: replaced
    by: Lei 14.113/2020
    note:
      pt: Substituída em 2020 pela regulamentação do Fundeb permanente.
      en: Replaced in 2020 by the regulation of the permanent Fundeb.
- title:
    pt: Plano de Metas Compromisso Todos pela Educação e Ideb
    en: Targets plan Commitment All for Education and Ideb
  year: 2007
  date: '2007-04-24'
  instrument: Decreto 6.094/2007
  submodules:
  - ensino-fundamental
  - ensino-medio
  - planejamento
  description:
    pt: Adota o Índice de Desenvolvimento da Educação Básica, que combina desempenho nas avaliações e
      fluxo escolar, com metas por rede e planos de ações articuladas com os municípios.
    en: Adopts the Basic Education Development Index, which combines assessment performance and school
      flow, with targets per school system and articulated action plans with municipalities.
  source: https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2007/decreto/d6094.htm
- title:
    pt: 'Reuni: expansão das universidades federais'
    en: 'Reuni: expansion of federal universities'
  year: 2007
  date: '2007-04-24'
  instrument: Decreto 6.096/2007
  submodules:
  - graduacao
  description:
    pt: Programa de expansão das universidades federais com mais vagas, cursos noturnos e metas contratadas,
      financiado por adesão.
    en: Federal university expansion program with more places, night courses and contracted targets, funded
      on adherence.
  source: https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2007/decreto/d6096.htm
- title:
    pt: Piso salarial do magistério
    en: Teacher salary floor
  year: 2008
  date: '2008-07-16'
  instrument: Lei 11.738/2008
  norm: lei-11738-2008
  submodules:
  - planejamento
  description:
    pt: Institui o piso salarial profissional nacional dos professores da educação básica pública e a
      reserva de um terço da jornada para atividades extraclasse.
    en: Institutes the national professional salary floor for public basic education teachers and reserves
      one third of the workload for non-classroom activities.
  source: https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2008/lei/l11738.htm
- title:
    pt: Institutos Federais de Educação, Ciência e Tecnologia
    en: Federal Institutes of Education, Science and Technology
  year: 2008
  date: '2008-12-29'
  instrument: Lei 11.892/2008
  norm: lei-11892-2008
  submodules:
  - educacao-profissional
  - graduacao
  description:
    pt: Institui a Rede Federal de Educação Profissional, Científica e Tecnológica e cria os institutos
      federais.
    en: Institutes the Federal Network of Vocational, Scientific and Technological Education and creates
      the federal institutes.
  source: https://www.planalto.gov.br/ccivil_03/_ato2007-2010/2008/lei/l11892.htm
- title:
    pt: Educação obrigatória dos quatro aos dezessete anos
    en: Compulsory education from four to seventeen
  year: 2009
  date: '2009-11-11'
  instrument: Emenda Constitucional 59/2009
  norm: ec-59-2009
  submodules:
  - educacao-infantil
  - ensino-fundamental
  - ensino-medio
  - financiamento
  description:
    pt: Torna obrigatória a educação básica dos quatro aos dezessete anos e determina a eliminação gradual
      da desvinculação de receitas para a educação.
    en: Makes basic education compulsory from four to seventeen and orders the gradual end of revenue
      delinking for education.
  source: https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc59.htm
cuts:
- kind: earmark
  title:
    pt: Prorrogação da DRU e fim gradual para a educação
    en: DRU extension and gradual end for education
  year: 2007
  submodules:
  - financiamento
  description:
    pt: A emenda de 2007 prorrogou a desvinculação de receitas da União; a emenda de 2009 fez a desvinculação
      cair por etapas sobre a base da educação, a partir de 2009 (percentuais não conferidos).
    en: The 2007 amendment extended the Union revenue delinking; the 2009 amendment made the delinking
      on the education base fall in steps from 2009 (percentages not checked).
  source: https://www.planalto.gov.br/ccivil_03/constituicao/emendas/emc/emc59.htm
  instrument: Emenda Constitucional 59/2009
