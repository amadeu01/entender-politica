# Módulo de educação: subtemas, indicadores de cada um e métricas planejadas.
# Indicadores listados aqui precisam existir em /indicadores. Métricas planejadas ainda
# não têm dado coletado: o código da série deve ser conferido na API da fonte antes de
# virar indicador (ver docs/adr/0012-modulo-educacao.md).
overview_indicators:
  - undp_hdr.eys
  - undp_hdr.mys

submodules:
  - id: educacao-infantil
    name: { pt: "Educação infantil", en: "Early childhood education" }
    summary:
      pt: "Creche e pré-escola, a primeira etapa da educação básica."
      en: "Nursery and pre-school, the first stage of basic education."
    planned_metrics:
      - name: { pt: "Taxa bruta de matrícula na pré-escola", en: "Gross pre-primary enrollment rate" }
        source: wdi
        code: SE.PRE.ENRR
        note:
          pt: "Série do Banco Mundial; a cobertura de creche (faixa mais nova) vem do Inep e da PNAD Contínua."
          en: "World Bank series; nursery coverage (the youngest group) comes from Inep and the Continuous PNAD."

  - id: ensino-fundamental
    name: { pt: "Ensino fundamental", en: "Primary and lower secondary (ensino fundamental)" }
    summary:
      pt: "A etapa obrigatória mais longa, dos anos iniciais aos finais."
      en: "The longest compulsory stage, from the early to the final grades."
    planned_metrics:
      - name: { pt: "Taxa bruta de matrícula no ensino primário", en: "Gross primary enrollment rate" }
        source: wdi
        code: SE.PRM.ENRR
        note:
          pt: "Pode passar de cem por cento quando há alunos fora da idade esperada."
          en: "Can exceed one hundred percent when students are outside the expected age."
      - name: { pt: "Taxa de conclusão do ensino primário", en: "Primary completion rate" }
        source: wdi
        code: SE.PRM.CMPT.ZS
        note:
          pt: "Aprendizado vem do Ideb e do Saeb (Inep), que ainda não têm conector."
          en: "Learning outcomes come from Ideb and Saeb (Inep), which have no connector yet."

  - id: ensino-medio
    name: { pt: "Ensino médio", en: "Upper secondary (ensino médio)" }
    summary:
      pt: "Última etapa da educação básica, com currículo alterado pelas reformas de 2017 e 2024."
      en: "Last stage of basic education, with a curriculum changed by the 2017 and 2024 reforms."
    planned_metrics:
      - name: { pt: "Taxa bruta de matrícula no ensino secundário", en: "Gross secondary enrollment rate" }
        source: wdi
        code: SE.SEC.ENRR
        note:
          pt: "Frequência líquida e abandono vêm da PNAD Contínua (SIDRA) e do Censo Escolar."
          en: "Net attendance and dropout come from the Continuous PNAD (SIDRA) and the School Census."

  - id: educacao-profissional
    name: { pt: "Educação profissional e técnica", en: "Vocational and technical education" }
    summary:
      pt: "Cursos técnicos e de qualificação, incluindo a rede dos institutos federais."
      en: "Technical and qualification courses, including the federal institutes network."
    planned_metrics:
      - name: { pt: "Matrícula vocacional no ensino secundário", en: "Vocational share of secondary enrollment" }
        source: wdi
        code: SE.SEC.ENRL.VO.ZS
        note:
          pt: "Código a conferir; os microdados do Censo Escolar dão o detalhe por rede."
          en: "Code to be confirmed; School Census microdata give the detail by network."

  - id: graduacao
    name: { pt: "Graduação", en: "Undergraduate education" }
    summary:
      pt: "Ensino superior de graduação, com ingresso, cotas e financiamento estudantil."
      en: "Undergraduate higher education, with admission, quotas and student financing."
    planned_metrics:
      - name: { pt: "Taxa bruta de matrícula no ensino superior", en: "Gross tertiary enrollment rate" }
        source: wdi
        code: SE.TER.ENRR
        note:
          pt: "Composição por raça e renda vem da PNAD Contínua e do Censo da Educação Superior."
          en: "Breakdown by race and income comes from the Continuous PNAD and the Higher Education Census."

  - id: pos-graduacao-ciencia
    name: { pt: "Pós-graduação, ciência e tecnologia", en: "Graduate education, science and technology" }
    summary:
      pt: "Pesquisa, pós-graduação e o arcabouço legal de ciência, tecnologia e inovação."
      en: "Research, graduate programs and the legal framework for science, technology and innovation."
    planned_metrics:
      - name: { pt: "Gasto em pesquisa e desenvolvimento, em proporção do PIB", en: "R&D expenditure as a share of GDP" }
        source: wdi
        code: GB.XPD.RSDV.GD.ZS
        note:
          pt: "Pesquisadores e artigos científicos têm séries próprias no Banco Mundial."
          en: "Researchers and scientific articles have their own World Bank series."
      - name: { pt: "Pesquisadores em P&D por milhão de habitantes", en: "Researchers in R&D per million people" }
        source: wdi
        code: SP.POP.SCIE.RD.P6
        note:
          pt: "Títulos de mestrado e doutorado vêm da Capes, ainda sem conector."
          en: "Master's and doctoral degrees come from Capes, which has no connector yet."

  - id: financiamento
    name: { pt: "Financiamento da educação", en: "Education funding" }
    summary:
      pt: "Fundeb, vinculações constitucionais e o regime fiscal que limita o gasto."
      en: "Fundeb, constitutional earmarks and the fiscal regime that caps spending."
    planned_metrics:
      - name: { pt: "Gasto público em educação, em proporção do PIB", en: "Government education expenditure as a share of GDP" }
        source: wdi
        code: SE.XPD.TOTL.GD.ZS
        note:
          pt: "As transferências do Fundeb vêm do Tesouro Nacional e do FNDE, ainda sem conector."
          en: "Fundeb transfers come from the National Treasury and FNDE, which have no connector yet."

  - id: planejamento
    name: { pt: "Planejamento e profissionais da educação", en: "Planning and education professionals" }
    summary:
      pt: "Lei de Diretrizes e Bases, planos nacionais de educação e carreira docente."
      en: "The national education guidelines law, national education plans and the teaching career."
    planned_metrics:
      - name: { pt: "Taxa de alfabetização de adultos", en: "Adult literacy rate" }
        source: wdi
        code: SE.ADT.LITR.ZS
        note:
          pt: "Metas dos planos nacionais usam Ideb, Saeb e a PNAD Contínua, sem conector ainda."
          en: "National plan targets use Ideb, Saeb and the Continuous PNAD, without a connector yet."
