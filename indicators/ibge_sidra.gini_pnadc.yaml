id: ibge_sidra.gini_pnadc
source: ibge_sidra
source_code: "7435/10681"
source_params:
  table: "7435"
  variable: "10681"
  cv_variable: "10682"
unit: index_0_1
min: 0
max: 1
name:
  pt: "Índice de Gini do rendimento domiciliar per capita (PNAD Contínua)"
  en: "Gini index of household income per capita (Continuous PNAD)"
definition:
  pt: >-
    Desigualdade do rendimento domiciliar per capita de todas as fontes, a preços médios
    do ano, calculada pelo IBGE com a PNAD Contínua anual. Vai de 0 (igualdade perfeita)
    a 1. Série oficial do IBGE desde 2012.
  en: >-
    Inequality of household income per capita from all sources, at average prices of the
    year, computed by IBGE from the annual Continuous PNAD. Ranges from 0 (perfect
    equality) to 1. IBGE's official series since 2012.
formula:
  pt: "G = 1 − 2·∫₀¹ L(p) dp, sobre o rendimento domiciliar per capita, com pesos amostrais."
  en: "G = 1 − 2·∫₀¹ L(p) dp, over household income per capita, using survey weights."
uncertainty:
  pt: "Intervalo de 95% calculado a partir do coeficiente de variação publicado pelo IBGE: valor ± 1,96 × valor × CV."
  en: "95% interval computed from the coefficient of variation published by IBGE: value ± 1.96 × value × CV."
criticisms:
  - pt: >-
      Pesquisa domiciliar subestima as rendas do topo; com dados tributários, a
      desigualdade é maior e caiu menos (Medeiros, Souza e Castro, 2015).
    en: >-
      Household surveys underestimate top incomes; with tax data, inequality is higher and
      fell less (Medeiros, Souza and Castro, 2015).
  - pt: >-
      Não é comparável em nível com a PNAD antiga (até 2015); não emende as duas séries.
    en: >-
      Not level-comparable with the old PNAD (to 2015); do not splice the two series.
  - pt: "Em 2020 e 2021 a renda vem da 5ª visita (pandemia); as demais edições usam a 1ª."
    en: "In 2020 and 2021 income comes from the 5th visit (pandemic); other editions use the 1st."
references:
  - citation: "Medeiros, M., Souza, P. H. G. F., & Castro, F. A. (2015). O topo da distribuição de renda no Brasil: primeiras estimativas com dados tributários e comparação com pesquisas domiciliares (2006–2012). Dados, 58(1)."
    doi: 10.1590/00115258201537
  - citation: "IBGE. SIDRA — Tabela 7435."
    url: https://sidra.ibge.gov.br/tabela/7435
series_breaks:
  - year: 2020
    note:
      pt: "Renda da 5ª visita da PNAD Contínua em 2020–2021 (pandemia)."
      en: "Income from the Continuous PNAD 5th visit in 2020–2021 (pandemic)."
  - year: 2022
    note:
      pt: "Retorno à 1ª visita da PNAD Contínua."
      en: "Return to the Continuous PNAD 1st visit."
