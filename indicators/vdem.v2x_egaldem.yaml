id: vdem.v2x_egaldem
source: vdem
source_code: v2x_egaldem
unit: index_0_1
min: 0
max: 1
name:
  pt: "Índice de democracia igualitária (V-Dem)"
  en: "Egalitarian democracy index (V-Dem)"
definition:
  pt: >-
    Mede até que ponto o ideal de democracia igualitária é alcançado: direitos e
    liberdades protegidos igualmente entre grupos sociais, recursos distribuídos de forma
    igual entre grupos e acesso igual ao poder. Também incorpora o nível de democracia
    eleitoral. Vai de 0 a 1.
  en: >-
    Measures to what extent the ideal of egalitarian democracy is achieved: rights and
    freedoms protected equally across social groups, resources distributed equally across
    groups and equal access to power. It also incorporates the level of electoral
    democracy. Ranges from 0 to 1.
formula:
  pt: "0,25·P^1,585 + 0,25·E + 0,5·P^1,585·E, em que P é o índice de democracia eleitoral e E o componente igualitário."
  en: "0.25·P^1.585 + 0.25·E + 0.5·P^1.585·E, where P is the electoral democracy index and E the egalitarian component."
uncertainty:
  pt: "Intervalo de 68% de maior densidade posterior do modelo de medição do V-Dem (colunas codelow e codehigh), aproximadamente um desvio padrão."
  en: "68% highest posterior density interval from the V-Dem measurement model (codelow and codehigh columns), roughly one standard deviation."
criticisms:
  - pt: >-
      Inclui na definição de democracia a distribuição de recursos entre grupos sociais
      (por exemplo, acesso a saúde e educação). Quem adota uma definição procedimental de
      democracia considera isso um resultado de políticas, não uma dimensão do regime;
      comparar este índice com indicadores sociais tem, por isso, alguma circularidade.
    en: >-
      Includes in the definition of democracy the distribution of resources across social
      groups (e.g. access to health and education). Those who adopt a procedural
      definition of democracy see this as a policy outcome, not a dimension of the regime;
      comparing this index with social indicators is therefore partly circular.
  - pt: >-
      Baseado em avaliações de especialistas agregadas por um modelo estatístico. Um
      debate recente discute se a tendência global de retrocesso democrático aparece em
      indicadores objetivos (como desempenho eleitoral de quem está no poder) ou se pode
      refletir viés dos avaliadores (Little e Meng, 2024; resposta em Knutsen et al., 2024).
    en: >-
      Based on expert assessments aggregated by a statistical model. A recent debate asks
      whether the global trend of democratic backsliding shows up in objective indicators
      (such as incumbent electoral performance) or may reflect coder bias (Little and Meng,
      2024; reply in Knutsen et al., 2024).
  - pt: >-
      Os valores absolutos não são comparáveis entre versões do V-Dem: cada versão reestima
      a série inteira. Compare apenas valores da mesma versão.
    en: >-
      Absolute values are not comparable across V-Dem versions: each version re-estimates
      the whole series. Compare values from the same version only.
  - pt: >-
      Os intervalos são largos; diferenças pequenas entre anos vizinhos ou entre países
      podem estar dentro da incerteza do modelo.
    en: >-
      Intervals are wide; small differences between adjacent years or countries may be
      within the model's uncertainty.
references:
