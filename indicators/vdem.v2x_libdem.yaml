id: vdem.v2x_libdem
source: vdem
source_code: v2x_libdem
unit: index_0_1
min: 0
max: 1
name:
  pt: "Índice de democracia liberal (V-Dem)"
  en: "Liberal democracy index (V-Dem)"
definition:
  pt: >-
    Mede até que ponto o ideal de democracia liberal é alcançado: proteção de direitos
    individuais e de minorias contra o Estado e contra a maioria, por meio de liberdades
    civis garantidas, Estado de direito, Judiciário independente e freios e contrapesos ao
    Executivo. Também incorpora o nível de democracia eleitoral. Vai de 0 a 1.
  en: >-
    Measures to what extent the ideal of liberal democracy is achieved: protection of
    individual and minority rights against the state and the majority, through protected
    civil liberties, rule of law, an independent judiciary and checks and balances on the
    executive. It also incorporates the level of electoral democracy. Ranges from 0 to 1.
formula:
  pt: "0,25·P^1,585 + 0,25·L + 0,5·P^1,585·L, em que P é o índice de democracia eleitoral e L o componente liberal."
  en: "0.25·P^1.585 + 0.25·L + 0.5·P^1.585·L, where P is the electoral democracy index and L the liberal component."
uncertainty:
  pt: "Intervalo de 68% de maior densidade posterior do modelo de medição do V-Dem (colunas codelow e codehigh), aproximadamente um desvio padrão."
  en: "68% highest posterior density interval from the V-Dem measurement model (codelow and codehigh columns), roughly one standard deviation."
criticisms:
  - pt: >-
      O expoente 1,585 e os pesos da fórmula são escolhas de agregação dos autores; o
      índice combina democracia eleitoral e componente liberal, então uma queda pode vir de
      qualquer um dos dois.
    en: >-
      The 1.585 exponent and the formula's weights are the authors' aggregation choices;
      the index combines electoral democracy and the liberal component, so a fall can come
      from either.
  - pt: >-
      Baseado em avaliações de especialistas agregadas por um modelo estatístico. Um
      debate recente discute se a tendência global de retrocesso democrático aparece em
      indicadores objetivos (como desempenho eleitoral de quem está no poder) ou se pode
      refletir viés dos avaliadores (Little e Meng, 2024; resposta em Knutsen et al., 2024).
    en: >-
      Based on expert assessments aggregated by a statistical model. A recent debate asks
      whether the global trend of democratic backsliding shows up in objective indicators
      (such as incumbent electoral performance) or may reflect coder bias (Little and Meng,
      2024; reply in Knutsen et al., 2024).
  - pt: >-
      Os valores absolutos não são comparáveis entre versões do V-Dem: cada versão reestima
      a série inteira. Compare apenas valores da mesma versão.
    en: >-
      Absolute values are not comparable across V-Dem versions: each version re-estimates
      the whole series. Compare values from the same version only.
  - pt: >-
      Os intervalos são largos; diferenças pequenas entre anos vizinhos ou entre países
      podem estar dentro da incerteza do modelo.
    en: >-
      Intervals are wide; small differences between adjacent years or countries may be
      within the model's uncertainty.
references:
  - citation: "Coppedge, M., Gerring, J., Altman, D., Bernhard, M., Fish, S., Hicken, A., et al. (2011). Conceptualizing and measuring democracy: a new approach. Perspectives on Politics, 9(2), 247–267."
    doi: 10.1017/S1537592711000880
