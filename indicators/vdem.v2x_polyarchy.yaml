id: vdem.v2x_polyarchy
source: vdem
source_code: v2x_polyarchy
unit: index_0_1
min: 0
max: 1
name:
  pt: "Índice de democracia eleitoral (V-Dem)"
  en: "Electoral democracy index (V-Dem)"
definition:
  pt: >-
    Mede até que ponto o ideal de democracia eleitoral é alcançado: governantes respondem
    aos cidadãos por meio de competição eleitoral, com sufrágio amplo, eleições limpas,
    organizações políticas e da sociedade civil livres, cargos executivos ocupados por
    eleição e, entre eleições, liberdade de expressão e imprensa independente. Vai de 0 a 1.
  en: >-
    Measures to what extent the ideal of electoral democracy is achieved: rulers are
    responsive to citizens through electoral competition, with extensive suffrage, clean
    elections, free political and civil society organizations, an elected executive and,
    between elections, freedom of expression and an independent media. Ranges from 0 to 1.
formula:
  pt: >-
    0,5·(C·L·A·S·E) + 0,5·(C/8 + L/4 + A/4 + S/8 + E/4), em que C = cargos eletivos,
    L = eleições limpas, A = liberdade de associação, S = sufrágio e E = liberdade de
    expressão e fontes alternativas de informação (codebook V-Dem v16, seção 2.1.1).
  en: >-
    0.5·(C·L·A·S·E) + 0.5·(C/8 + L/4 + A/4 + S/8 + E/4), where C = elected officials,
    L = clean elections, A = freedom of association, S = suffrage and E = freedom of
    expression and alternative sources of information (V-Dem codebook v16, section 2.1.1).
uncertainty:
  pt: "Intervalo de 68% de maior densidade posterior do modelo de medição do V-Dem (colunas codelow e codehigh), aproximadamente um desvio padrão."
  en: "68% highest posterior density interval from the V-Dem measurement model (codelow and codehigh columns), roughly one standard deviation."
criticisms:
  - pt: >-
      Os pesos e a combinação meio aditiva, meio multiplicativa são escolhas dos autores:
      um compromisso entre permitir compensação entre componentes e punir o "elo mais
      fraco". Outras escolhas mudariam a posição dos países.
    en: >-
      The weights and the half-additive, half-multiplicative combination are the authors'
      choices: a compromise between allowing compensation across components and punishing
      the "weakest link". Other choices would change countries' positions.
  - pt: >-
      Baseado em avaliações de especialistas agregadas por um modelo estatístico. Um
      debate recente discute se a tendência global de retrocesso democrático aparece em
      indicadores objetivos (como desempenho eleitoral de quem está no poder) ou se pode
      refletir viés dos avaliadores (Little e Meng, 2024; resposta em Knutsen et al., 2024).
    en: >-
      Based on expert assessments aggregated by a statistical model. A recent debate asks
      whether the global trend of democratic backsliding shows up in objective indicators
      (such as incumbent electoral performance) or may reflect coder bias (Little and Meng,
      2024; reply in Knutsen et al., 2024).
  - pt: >-
      Os valores absolutos não são comparáveis entre versões do V-Dem: cada versão reestima
      a série inteira. Compare apenas valores da mesma versão.
    en: >-
      Absolute values are not comparable across V-Dem versions: each version re-estimates
      the whole series. Compare values from the same version only.
  - pt: >-
      Os intervalos são largos; diferenças pequenas entre anos vizinhos ou entre países
      podem estar dentro da incerteza do modelo.
    en: >-
      Intervals are wide; small differences between adjacent years or countries may be
      within the model's uncertainty.
references:
