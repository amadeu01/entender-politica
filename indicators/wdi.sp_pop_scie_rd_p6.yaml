id: wdi.sp_pop_scie_rd_p6
source: wdi
source_code: SP.POP.SCIE.RD.P6
unit: per_million_people
min: 0
name:
  pt: Pesquisadores em P&D (por milhão de habitantes)
  en: Researchers in R&D (per million people)
definition:
  pt: Profissionais envolvidos na concepção ou criação de conhecimento, produtos e métodos novos,
    por milhão de habitantes. Dados do UIS, reproduzidos pelo Banco Mundial.
  en: Professionals engaged in the conception or creation of new knowledge, products and methods,
    per million people. UIS data, republished by the World Bank.
formula:
  pt: Pesquisadores em P&D / população × 1.000.000.
  en: Researchers in R&D / population × 1,000,000.
criticisms:
- pt: A série para o Brasil termina antes do fim do período de análise, e a contagem por pessoas
    ou por equivalente em tempo integral pode variar entre anos.
  en: The series for Brazil ends before the end of the analysis period, and counting by headcount
    or by full-time equivalent can vary across years.
references:
- citation: World Bank. World Development Indicators — metadata for SP.POP.SCIE.RD.P6.
  url: https://data.worldbank.org/indicator/SP.POP.SCIE.RD.P6
- citation: 'UNESCO Institute for Statistics. Education and science data: methodology.'
  url: https://uis.unesco.org/
