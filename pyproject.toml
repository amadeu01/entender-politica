[project]
name = "compilador"
version = "0.1.0"
description = "Data pipeline for Entender Política: collects, normalizes and validates open data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "markdown>=3.11.2",
    "pandas>=3.1.0",
    "pandera>=0.35.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.scripts]
compilador = "compilador.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline/compilador"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
pythonpath = ["pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["compilador", "tests"]
